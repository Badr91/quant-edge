<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal | QuantEdge Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="padding-top: 80px;">
    <!-- Nav and Footer are injected via js/main.js -->

    <section class="hero" style="height: 30vh; background: var(--bg-secondary);">
        <h1>Institutional <span style="color: var(--accent-color);">Journal</span></h1>
        <p>Audit your edge. Quantify your errors. Master your psychology.</p>
    </section>

    <section>
        <div class="portal-container">
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                <div class="card" style="border: 1px solid var(--accent-color);">
                    <h3 style="margin-bottom: 1.5rem;">Log New Trade</h3>
                    <form id="journal-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="color: var(--white); font-size: 0.8rem;">Pair/Asset</label>
                            <input type="text" id="j-pair" placeholder="EURUSD" required style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="color: var(--white); font-size: 0.8rem;">Outcome</label>
                            <select id="j-outcome" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                                <option value="Win">Win</option>
                                <option value="Loss">Loss</option>
                                <option value="BE">Break Even</option>
                            </select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="color: var(--white); font-size: 0.8rem;">R:R Achieved</label>
                            <input type="number" id="j-rr" step="0.1" placeholder="e.g. 3.5" required style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="color: var(--white); font-size: 0.8rem;">Date</label>
                            <input type="date" id="j-date" required style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem; grid-column: span 2;">
                            <label style="color: var(--white); font-size: 0.8rem;">Notes / Psychological State</label>
                            <textarea id="j-notes" rows="3" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="grid-column: span 2; width: 100%;">Save Trade to Local Storage</button>
                    </form>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 1.5rem;">Trade History</h3>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left; color: var(--text-main);">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--accent-color); color: var(--accent-color); font-size: 0.85rem;">
                                    <th style="padding: 1rem;">Date</th>
                                    <th style="padding: 1rem;">Asset</th>
                                    <th style="padding: 1rem;">Outcome</th>
                                    <th style="padding: 1rem;">R:R</th>
                                    <th style="padding: 1rem;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="journal-body">
                                <!-- Trades injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <aside class="sidebar">
                <div class="sidebar-widget">
                    <h4>Performance Metrics</h4>
                    <div style="text-align: center; padding: 1rem 0;">
                        <div style="font-size: 0.8rem; color: var(--text-dim);">Total Win Rate</div>
                        <div id="win-rate" style="font-size: 2.5rem; color: var(--accent-color); font-weight: 700;">0%</div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                            <span>Total Trades:</span> <span id="total-trades" style="color: var(--white);">0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                            <span>Wins:</span> <span id="total-wins" style="color: var(--accent-color);">0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                            <span>Losses:</span> <span id="total-losses" style="color: #ff6464;">0</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <script type="module" src="js/main.js"></script>
</body>
</html>
