<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Tools | QuantEdge Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Nav and Footer are injected via js/main.js -->

    <section class="hero" style="height: 40vh;">
        <h1>Quant <span style="color: var(--accent-color);">Tools</span></h1>
        <p>Precision instruments for professional risk management.</p>
    </section>

    <section>
        <div class="section-title">
            <h2>Position Size Calculator</h2>
            <p>Calculate your lot size based on account risk to ensure long-term survival.</p>
        </div>

        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card" style="border: 1px solid var(--accent-color);">
                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label style="color: var(--white); font-size: 0.9rem;">Account Balance ($)</label>
                        <input type="number" id="calc-balance" value="10000" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label style="color: var(--white); font-size: 0.9rem;">Risk Percentage (%)</label>
                        <input type="number" id="calc-risk" value="1" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label style="color: var(--white); font-size: 0.9rem;">Stop Loss (Pips)</label>
                        <input type="number" id="calc-sl" value="20" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label style="color: var(--white); font-size: 0.9rem;">Currency Pair</label>
                        <select id="calc-pair" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                            <option value="10">Major (EURUSD, GBPUSD)</option>
                            <option value="7">JPY Pair (USDJPY, EURJPY)</option>
                            <option value="1">Gold (XAUUSD)</option>
                        </select>
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 2rem;">
                    <button id="calc-btn" class="btn btn-primary" style="width: 100%; max-width: 300px;">Calculate Position Size</button>
                </div>

                <div id="calc-result" style="margin-top: 2rem; text-align: center; display: none; padding: 1.5rem; background: rgba(100, 255, 218, 0.05); border-radius: 8px; border: 1px dashed var(--accent-color);">
                    <p style="color: var(--text-dim); margin-bottom: 0.5rem;">Recommended Position Size</p>
                    <h2 id="result-lots" style="color: var(--accent-color); font-size: 2.5rem; margin: 0;">0.00 Lots</h2>
                    <p id="result-risk-amount" style="color: var(--white); margin-top: 0.5rem;">Risk Amount: $0.00</p>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="js/main.js"></script>
</body>
</html>
