<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | QuantEdge Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">QUANT<span>EDGE</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="markets.html">Markets</a></li>
            <li><a href="analysis.html">Analysis</a></li>
            <li><a href="quant.html">Quant System</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="quant.html" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.8rem;">Get Access</a>
    </nav>

    <section class="hero" style="height: 40vh;">
        <h1>Get in <span style="color: var(--accent-color);">Touch</span></h1>
        <p>Apply for the QuantEdge System or inquire about our analysis services.</p>
    </section>

    <section style="max-width: 600px; margin: 0 auto;">
        <div class="card" style="border: 1px solid var(--accent-color);">
            <!-- UPDATE THE ACTION URL BELOW WITH YOUR FORMSPREE LINK -->
            <form action="https://formspree.io/f/mbgjzwjd" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label style="color: var(--white); font-size: 0.9rem;">Full Name</label>
                    <input type="text" name="full_name" required style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label style="color: var(--white); font-size: 0.9rem;">Email Address</label>
                    <input type="email" name="email" required style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label style="color: var(--white); font-size: 0.9rem;">Inquiry Type</label>
                    <select name="inquiry_type" style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;">
                        <option>Quant System Access</option>
                        <option>Market Analysis Inquiry</option>
                        <option>Partnership</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label style="color: var(--white); font-size: 0.9rem;">Message</label>
                    <textarea name="message" rows="5" required style="padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--text-dim); color: var(--white); border-radius: 4px;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 QuantEdge Intelligence. All Rights Reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
