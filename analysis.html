<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis | QuantEdge Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Nav and Footer are injected via js/main.js -->

    <section class="hero" style="height: 40vh;">
        <h1>Market <span style="color: var(--accent-color);">Analysis</span></h1>
        <p>Regular updates and quantitative breakdowns of current market trends.</p>
    </section>

    <section>
        <div class="section-title">
            <h2>Quantitative Insights</h2>
            <p>Filter by asset class to find the intelligence you need.</p>
            <div style="margin-top: 1.5rem;">
                <select id="analysis-filter" style="padding: 0.6rem 1.2rem; background: var(--bg-color); border: 1px solid var(--accent-color); color: var(--white); border-radius: 4px; cursor: pointer;">
                    <option value="All">All Assets</option>
                    <option value="Crypto">Crypto</option>
                    <option value="Forex">Forex</option>
                    <option value="Equities">Equities</option>
                </select>
            </div>
        </div>
        <div class="grid" id="analysis-grid">
            <!-- Analysis cards are injected dynamically via js/main.js -->
        </div>
    </section>

    <script type="module" src="js/main.js"></script>
</body>
</html>
